name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.6.6
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate source metadata and JavaScript
        shell: pwsh
        run: .\scripts\validate-source.ps1 -RequireNode

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Validate tag and project versions
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH format: $tag"
          }

          $engineText = Get-Content .\UMM.Engine.ahk -Raw
          $engineMatch = [regex]::Match($engineText, 'global AppVersion := "([^"]+)"')
          if (-not $engineMatch.Success) {
            throw "Could not read AppVersion from UMM.Engine.ahk."
          }

          $projectXml = [xml](Get-Content .\UIHost\UMM.UI.csproj -Raw)
          $projectVersion = "v" + $projectXml.Project.PropertyGroup.Version

          $buildInfo = Get-Content .\UIHost\ui\build-info.json -Raw | ConvertFrom-Json

          if ($engineMatch.Groups[1].Value -ne $tag) {
            throw "Engine version $($engineMatch.Groups[1].Value) does not match tag $tag."
          }
          if ($projectVersion -ne $tag) {
            throw "UI project version $projectVersion does not match tag $tag."
          }
          if ($buildInfo.version -ne $tag) {
            throw "Web UI version $($buildInfo.version) does not match tag $tag."
          }
          if ($null -ne $buildInfo.buildDate -and -not [string]::IsNullOrWhiteSpace([string]$buildInfo.buildDate)) {
            throw "Source build-info.json must not contain a local build date."
          }

      - name: Build runtime package
        shell: pwsh
        run: .\scripts\build-and-stage.ps1

      - name: Verify runtime package
        shell: pwsh
        run: |
          $required = @(
            '.\dist\UMM.Engine.ahk',
            '.\dist\UMM.UI.exe',
            '.\dist\ui\index.html',
            '.\dist\ui\app.js',
            '.\dist\Macros\registry.ini',
            '.\dist\Assets\fonts\OFL.txt',
            '.\dist\LICENSE',
            '.\dist\docs\MACRO_CREDITS.md'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Release package is missing: $path"
            }
          }

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $assetName = "GI-Macro-Manager-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path .\dist\* -DestinationPath $assetName -CompressionLevel Optimal

          $checksumName = "$assetName.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $assetName).Hash.ToLowerInvariant()
          Set-Content -Path $checksumName -Value "$hash  $assetName" -Encoding ascii -NoNewline

          "RELEASE_ASSET=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksumName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" `
              "$env:RELEASE_ASSET" "$env:RELEASE_CHECKSUM" --clobber
          }
          else {
            gh release create "$env:RELEASE_TAG" `
              "$env:RELEASE_ASSET" "$env:RELEASE_CHECKSUM" `
              --verify-tag `
              --generate-notes `
              --title "GI Macro Manager $env:RELEASE_TAG"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }

  notify-discord:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Read release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,url,body > release.json

      - name: Send Discord webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook_url:
              raise RuntimeError(
                  "DISCORD_WEBHOOK repository secret is missing or empty."
              )

          with open("release.json", encoding="utf-8") as release_file:
              release = json.load(release_file)

          release_name = release.get("name") or os.environ["RELEASE_TAG"]
          release_url = release.get("url") or ""
          release_body = (
              release.get("body") or "No details provided."
          )[:4000]

          payload = {
              "content": (
                  "<@&1533499842293137608> 🚀 "
                  "**GI Macro Manager — New Release Available!**\n\n"
                  "We are excited to announce the latest version of "
                  "**GI Macro Manager**!"
              ),
              "allowed_mentions": {
                  "roles": ["1533499842293137608"]
              },
              "embeds": [
                  {
                      "title": f"📌 {release_name}",
                      "url": release_url,
                      "description": release_body,
                      "color": 3066993,
                      "fields": [
                          {
                              "name": "📥 Download & Setup",
                              "value": (
                                  f"• [Official Download Link]({release_url})\n"
                                  "• Installation steps available in "
                                  "<#1532699557195157594>"
                              ),
                              "inline": False
                          },
                          {
                              "name": "💬 Support & Feedback",
                              "value": (
                                  "Experiencing issues? Report them in "
                                  "<#1532700234394898472> or share ideas in "
                                  "<#1532700380020871218>!"
                              ),
                              "inline": False
                          }
                      ]
                  }
              ]
          }

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GI-Macro-Manager-Release-Notifier/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"Discord returned HTTP {error.code}: {details}"
              ) from error

          if status not in (200, 204):
              raise RuntimeError(f"Discord returned HTTP {status}")
          PY
