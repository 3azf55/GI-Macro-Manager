name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate tag and project version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $engineText = Get-Content .\UMM.Engine.ahk -Raw
          $engineMatch = [regex]::Match($engineText, 'global AppVersion := "([^"]+)"')
          if (-not $engineMatch.Success) {
            throw "Could not read AppVersion from UMM.Engine.ahk."
          }

          $projectXml = [xml](Get-Content .\UIHost\UMM.UI.csproj -Raw)
          $projectVersion = "v" + $projectXml.Project.PropertyGroup.Version

          if ($engineMatch.Groups[1].Value -ne $tag) {
            throw "Engine version $($engineMatch.Groups[1].Value) does not match tag $tag."
          }

          if ($projectVersion -ne $tag) {
            throw "UI project version $projectVersion does not match tag $tag."
          }

      - name: Build runtime package
        shell: pwsh
        run: .\scripts\build-and-stage.ps1

      - name: Create release ZIP
        shell: pwsh
        run: |
          $assetName = "GI-Macro-Manager-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path .\dist\* -DestinationPath $assetName -CompressionLevel Optimal
          "RELEASE_ASSET=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" "$env:RELEASE_ASSET" --clobber
          }
          else {
            gh release create "$env:GITHUB_REF_NAME" "$env:RELEASE_ASSET" `
              --verify-tag `
              --generate-notes `
              --title "GI Macro Manager $env:GITHUB_REF_NAME"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }
