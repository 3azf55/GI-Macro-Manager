name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.6.5
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Validate tag and project versions
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH format: $tag"
          }

          $engineText = Get-Content .\UMM.Engine.ahk -Raw
          $engineMatch = [regex]::Match($engineText, 'global AppVersion := "([^"]+)"')
          if (-not $engineMatch.Success) {
            throw "Could not read AppVersion from UMM.Engine.ahk."
          }

          $projectXml = [xml](Get-Content .\UIHost\UMM.UI.csproj -Raw)
          $projectVersion = "v" + $projectXml.Project.PropertyGroup.Version

          $buildInfo = Get-Content .\UIHost\ui\build-info.json -Raw | ConvertFrom-Json

          if ($engineMatch.Groups[1].Value -ne $tag) {
            throw "Engine version $($engineMatch.Groups[1].Value) does not match tag $tag."
          }
          if ($projectVersion -ne $tag) {
            throw "UI project version $projectVersion does not match tag $tag."
          }
          if ($buildInfo.version -ne $tag) {
            throw "Web UI version $($buildInfo.version) does not match tag $tag."
          }

      - name: Build runtime package
        shell: pwsh
        run: .\scripts\build-and-stage.ps1

      - name: Verify runtime package
        shell: pwsh
        run: |
          $required = @(
            '.\dist\UMM.Engine.ahk',
            '.\dist\UMM.UI.exe',
            '.\dist\ui\index.html',
            '.\dist\ui\app.js',
            '.\dist\Macros\registry.ini',
            '.\dist\Assets\fonts\OFL.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Release package is missing: $path"
            }
          }

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $assetName = "GI-Macro-Manager-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path .\dist\* -DestinationPath $assetName -CompressionLevel Optimal

          $checksumName = "$assetName.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $assetName).Hash.ToLowerInvariant()
          Set-Content -Path $checksumName -Value "$hash  $assetName" -Encoding ascii -NoNewline

          "RELEASE_ASSET=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksumName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" `
              "$env:RELEASE_ASSET" "$env:RELEASE_CHECKSUM" --clobber
          }
          else {
            gh release create "$env:RELEASE_TAG" `
              "$env:RELEASE_ASSET" "$env:RELEASE_CHECKSUM" `
              --verify-tag `
              --generate-notes `
              --title "GI Macro Manager $env:RELEASE_TAG"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }
