name: Send Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 -c '
          import os, json, urllib.request

          webhook_url = os.environ["DISCORD_WEBHOOK"]
          rel_name = os.environ.get("RELEASE_NAME") or "New Release"
          rel_url = os.environ.get("RELEASE_URL") or ""
          rel_body = os.environ.get("RELEASE_BODY") or "No details provided."

          payload = {
              "content": "<@&1533499842293137608> 🚀 **GI Macro Manager — New Release Available!**\n\nWe are excited to announce the latest version of **GI Macro Manager**!",
              "embeds": [
                  {
                      "title": f"📌 {rel_name}",
                      "url": rel_url,
                      "description": rel_body,
                      "color": 3066993,
                      "fields": [
                          {
                              "name": "📥 Download & Setup",
                              "value": f"• [Official Download Link]({rel_url})\n• Installation steps available in <#1532699557195157594>",
                              "inline": False
                          },
                          {
                              "name": "💬 Support & Feedback",
                              "value": "Experiencing issues? Report them in <#1532700234394898472> or share ideas in <#1532700380020871218>!",
                              "inline": False
                          }
                      ]
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
          )
          urllib.request.urlopen(req)
          '
